# =============================================================================
# Hermes host agent - starter
# =============================================================================

name: methodologyagent

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: methodologyagent:0.3.0
    container_name: methodologyagent
    restart: unless-stopped

    env_file:
      # Optional: a server can pass real env vars instead of shipping a .env
      - path: .env
        required: false

    environment:
      APP_NAME: ${APP_NAME:-methodologyagent}
      APP_ENV: ${APP_ENV:-production}
      APP_HOST: 0.0.0.0
      APP_PORT: 8080
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_DIR: /app/logs
      LOG_FORMAT: ${LOG_FORMAT:-json}
      # LLM: one switch, two blocks — see .env.example
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      HERMES_TASK_MODEL: ${HERMES_TASK_MODEL:-}
      OPENAI_TASK_MODEL: ${OPENAI_TASK_MODEL:-}
      # Local OpenAI-compatible server (Ollama / vLLM / LM Studio). The host
      # machine is reachable at host.docker.internal — see extra_hosts below.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
      OLLAMA_TASK_MODEL: ${OLLAMA_TASK_MODEL:-}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      HERMES_TASK_ROUTING: ${HERMES_TASK_ROUTING:-true}
      HERMES_HOME: /home/appuser/.hermes
      # One full Hermes profile per user lives under here — see README
      # "Multi-user isolation". Own volume, so it survives a redeploy and is
      # never nested inside the shared home.
      HERMES_USERS_HOME: /home/appuser/.hermes-users
      HERMES_REQUIRE_USER_ID: ${HERMES_REQUIRE_USER_ID:-true}
      HERMES_ENABLE_PROJECT_PLUGINS: "true"
      PYTHONPATH: /opt/hermes-agent
      # Left empty on purpose: the host derives it from LLM_PROVIDER.
      HERMES_INFERENCE_PROVIDER: ${HERMES_INFERENCE_PROVIDER:-}
      HERMES_ENABLED_TOOLSETS: ${HERMES_ENABLED_TOOLSETS:-memory,session_search,skills,todo}
      HERMES_SYSTEM_PROMPT_PATH: /app/prompts/hermes_coordinator.md
      HERMES_MAX_ITERATIONS: ${HERMES_MAX_ITERATIONS:-12}
      HERMES_SESSION_HISTORY_LIMIT: ${HERMES_SESSION_HISTORY_LIMIT:-6}
      HERMES_SKIP_MEMORY: ${HERMES_SKIP_MEMORY:-false}
      HERMES_REASONING_ENABLED: ${HERMES_REASONING_ENABLED:-false}
      # Shared secret the gateway must send. No default: an unset value stops
      # the service rather than opening /v1/chat.
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:-}
      ALLOW_UNAUTHENTICATED: ${ALLOW_UNAUTHENTICATED:-false}
      MAX_MESSAGE_CHARS: ${MAX_MESSAGE_CHARS:-8000}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-30}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-10}
      # Exact origins only; empty disables cross-origin access. The gateway
      # calls server-side and needs none.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      HEALTHCHECK_URL: http://127.0.0.1:8080/health
      # Knowledge stores. Restored from data/backups by
      # scripts/restore_backups.sh -- see README "Bilimlar bazasi".
      # Service names, not published ports: these resolve on the compose
      # network, so the loopback bindings below stay for human tools only.
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-nmc}:${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}@mongo:27017/?authSource=admin
      MONGO_DB: ${MONGO_DB:-nmc}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
      # Embedding service for semantic search. External and not managed by
      # this compose file -- host.docker.internal is what makes a service on
      # the host reachable from in here (see extra_hosts below).
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://host.docker.internal:8090}
      EMBEDDING_BATCH: ${EMBEDDING_BATCH:-64}
      EMBEDDING_TIMEOUT: ${EMBEDDING_TIMEOUT:-120}

    # The host agent's tools query both stores, so it waits for them rather
    # than starting into connection errors. `service_healthy`, not
    # `service_started`: Neo4j accepts TCP long before it answers Bolt.
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy

    ports:
      # host:container — APP_PORT is the in-container bind port (always 8080);
      # HOST_PORT is what the outside world connects to. 8080 is taken on this
      # host, so the default is 9095.
      #
      # Bound to loopback: the gateway is the only intended caller, and it
      # trusts the X-User-Id header this service receives. Anything that can
      # reach this port directly could claim to be any user (given the token),
      # so it must not be exposed on a public interface. Set BIND_ADDRESS to a
      # private IP if the gateway runs on another host.
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-9095}:8080"

    # Reach an Ollama / vLLM / LM Studio server running on the host machine.
    # Docker Desktop provides this name already; Linux needs it spelled out.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    volumes:
      # Hermes writes memory, skills, session history and cache under
      # HERMES_HOME. A named volume keeps them across redeploys.
      - hermes_home:/home/appuser/.hermes:rw
      # Per-user profiles — separate volume, same durability guarantee.
      - hermes_users:/home/appuser/.hermes-users:rw
      - ./logs:/app/logs:rw
      - ./data:/app/data:rw
      - ./config:/app/config:ro
      - ./prompts:/app/prompts:ro

    healthcheck:
      test: ["CMD", "/app/scripts/healthcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # Knowledge stores
  #
  # Both are restored from `data/backups/` by `scripts/restore_backups.sh`;
  # they start empty otherwise. Image versions match the backups exactly --
  # mongo:7.0 for a 7.0 archive, neo4j:5.26 for a 5.26 dump -- because a dump
  # never loads into an older store and the archive format tracks the server.
  #
  # Published ports are loopback-only and sit in this stack's own block next
  # to the app's 9095 -- 9096 and 9097, nowhere near the ports a Neo4j or
  # Mongo container conventionally takes (7474/7687, 27017 and the 17474 /
  # 27117 offsets the nmc-knowledge stack uses). Another graph container
  # started later will not land on them by accident.
  #
  # Nothing in this project connects through them: the app reaches the two
  # services by name on the compose network.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:7.0
    container_name: methodologyagent-mongo
    restart: unless-stopped

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-nmc}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}

    ports:
      - "127.0.0.1:${MONGO_PORT:-27118}:27017"

    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
      # mongorestore reads the archive straight off this mount -- faster than
      # piping ~90 MB through docker's stdin, and read-only because nothing
      # here should ever write back into the backup folder.
      - ./data/backups:/backups:ro

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

  neo4j:
    image: neo4j:5.26-community
    container_name: methodologyagent-neo4j
    restart: unless-stopped

    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP:-1G}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-1G}
      # Browser at http://127.0.0.1:9096 connects over Bolt from the host, so
      # it must be told the published address rather than the container's.
      NEO4J_server_bolt_advertised__address: 127.0.0.1:${NEO4J_BOLT_PORT:-9097}
      NEO4J_server_http_advertised__address: 127.0.0.1:${NEO4J_HTTP_PORT:-9096}

    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-9096}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-9097}:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      # Community Edition loads a dump only while the store is stopped, so the
      # restore script does it from a throwaway container against `neo4j_data`
      # rather than through this one. The mount is here for `neo4j-admin
      # database dump` and for inspecting what is in the folder.
      - ./data/backups:/backups:ro

    healthcheck:
      # Bolt, not HTTP: the app talks Bolt, and HTTP answers a few seconds
      # earlier -- long enough for a dependent service to start too soon.
      # The credentials are interpolated by compose, not read inside the
      # container: the neo4j image turns any other NEO4J_* variable into a
      # config setting and refuses to start on an unknown one.
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p '${NEO4J_PASSWORD}' 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

    security_opt:
      - no-new-privileges:true

volumes:
  hermes_home:
    name: methodologyagent-hermes-home
  hermes_users:
    name: methodologyagent-hermes-users
  # Survive `down`; only `down -v` clears them, and a cleared store is a
  # re-run of scripts/restore_backups.sh away.
  mongo_data:
    name: methodologyagent-mongo-data
  mongo_config:
    name: methodologyagent-mongo-config
  neo4j_data:
    name: methodologyagent-neo4j-data
  neo4j_logs:
    name: methodologyagent-neo4j-logs

networks:
  default:
    name: methodologyagent-net
